name: release

# Only trigger, when the build workflow succeeded
on:
  push:
    branches:
      - master
      - release/**

# Set the default (global) permissions to read-only.
# Grant write permissions explicitly at the job level only where needed.
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  HOSTED_ZONE: dev.envalfresco.com
  BRANCH_NAME: ${{ github.ref_name }}
  ALFRESCO_URL: "http://localhost:8080/alfresco/"
  SHARE_URL: "http://localhost:8181/share"
  DISPLAY: :99.0
  WEBDRIVER_ARGUMENTS: '-Dwebdriver.local.grid=true -Dwebdriver.browser=RemoteFireFox -Dwebdriver.localGrid=false -Dorg.alfresco.rm.timeout_seconds.MEDIUM=30'
  GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 90

jobs:
  alfresco_enterprise_share:
    uses: ./.github/workflows/build.yml
    with:
      commitMessage: ''
    secrets: inherit


  release:
    runs-on: ubuntu-latest
    needs: [alfresco_enterprise_share]
    if: >
      (!contains(github.event.head_commit.message, '[no release]')
      && inputs.commitMessage != '[no release]')
      &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/'))
      &&
      github.event_name != 'pull_request'
      &&
      github.event.repository.fork == false
      &&
      !(failure() || cancelled())
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          owner: Alfresco
          repositories: alfresco-enterprise-share,alfresco-enterprise-repo
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: "Create local release branch"
        run: git checkout -B "${{ github.ref_name }}"
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: bash scripts/ci/init.sh
      - name: "Compute release and next development versions"
        id: versions
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-compute-release-versions@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
      - name: "Verify release version"
        run: bash scripts/ci/verify_release_tag.sh
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ steps.versions.outputs.release-version }}
          development-version: ${{ steps.versions.outputs.next-development-version }}
          release-profile: "ags"
          maven-args: "-DskipTests -Dbuild-number=${{ env.BUILD_NUMBER }}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  update_downstream:
    runs-on: ubuntu-latest
    needs: release
    if: >
      (!contains(github.event.head_commit.message, '[no downstream]')
      && inputs.commitMessage != '[no downstream]')
      &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/'))
      &&
      github.event_name != 'pull_request'
      &&
      github.event.repository.fork == false
      &&
      !(failure() || cancelled())
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            acs-packaging
            alfresco-enterprise-repo
            alfresco-enterprise-share
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@da99ab845e78301fcb0680d16cbc185a40a1938c # v18.24.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Update downstream"
        id: update-downstream
        run: bash scripts/ci/update_downstream.sh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: "Compute downstream commit message"
        id: commit-meta
        uses: Alfresco/alfresco-community-repo/.github/actions/get-downstream-commit-message@9d02ded141a7f6c9174e507de0761348af1b6448
        with:
          commit-title: ${{ github.event.head_commit.message }}
          version: ${{ steps.update-downstream.outputs.version }}
          downstream-repo: "enterprise-share"
          trigger-release-on-force: "true"
      - name: "Commit downstream version update"
        uses: iarekylew00t/verified-bot-commit@42a042b0407248f3c0acac00c389e729e3476e86 # v2.3.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Alfresco/acs-packaging
          ref: ${{ github.ref_name }}
          workspace: ${{ github.workspace }}/../acs-packaging
          files: |
            pom.xml
            .github/release-versions.yml
          message: ${{ steps.commit-meta.outputs.message }}
          allow-empty-commit: ${{ steps.commit-meta.outputs.allow-empty-commit }}
          if-no-commit: info
          update-local: false
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  mirroring:
    runs-on: ubuntu-latest
    needs: update_downstream
    if: >
      (!contains(github.event.head_commit.message, '[no mirror]')
      && inputs.commitMessage != '[no mirror]')
      &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/'))
      &&
      github.event_name != 'pull_request'
      &&
      github.event.repository.fork == false
      &&
      !(failure() || cancelled())
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            alfresco-enterprise-share
            alfresco-community-share
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api '/users/${{ steps.app-token.outputs.app-slug }}[bot]' --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Configure GitHub App bot user
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Mirror to community repository
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/ci/mirror-community-repo.sh "https://github.com/Alfresco/alfresco-community-share.git"
