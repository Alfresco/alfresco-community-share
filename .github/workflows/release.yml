name: release

# Only trigger, when the build workflow succeeded
on:
  push:
    branches:
      - master
      - release/**

# Set the default (global) permissions to read-only.
# Grant write permissions explicitly at the job level only where needed.
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  HOSTED_ZONE: dev.envalfresco.com
  BRANCH_NAME: ${{ github.ref_name }}
  ALFRESCO_URL: "http://localhost:8080/alfresco/"
  SHARE_URL: "http://localhost:8181/share"
  DISPLAY: :99.0
  WEBDRIVER_ARGUMENTS: '-Dwebdriver.local.grid=true -Dwebdriver.browser=RemoteFireFox -Dwebdriver.localGrid=false -Dorg.alfresco.rm.timeout_seconds.MEDIUM=30'
  GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 90

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@v19.16.0
        id: get-commit
        with:
          header-only: "true"

  alfresco_enterprise_share:
    uses: ./.github/workflows/build.yml
    permissions:
      id-token: write
      contents: read
    with:
      commitMessage: ''
    secrets: inherit


  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [alfresco_enterprise_share, commit_parser]
    if: >
      (!contains(needs.commit_parser.outputs.title, '[no release]')
      && inputs.commitMessage != '[no release]')
      &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/'))
      &&
      github.event_name != 'pull_request'
      &&
      github.event.repository.fork == false
      &&
      !(failure() || cancelled())
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          owner: Alfresco
          repositories: alfresco-enterprise-share,alfresco-enterprise-repo
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: "Create local release branch"
        run: git checkout -B "${{ github.ref_name }}"
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@16298278308f674c76542d61658da190e975e31c # v19.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@16298278308f674c76542d61658da190e975e31c # v19.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: bash scripts/ci/init.sh
      - name: "Compute release and next development versions"
        id: versions
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-compute-release-versions@16298278308f674c76542d61658da190e975e31c # v19.16.0
      - name: "Verify release version"
        run: bash scripts/ci/verify_release_tag.sh
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ steps.versions.outputs.release-version }}
          development-version: ${{ steps.versions.outputs.next-development-version }}
          release-profile: "ags,release"
          prerelease-profile: prerelease
          maven-args: "-DskipTests -Dbuild-number=${{ env.BUILD_NUMBER }}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  update_downstream:
    runs-on: ubuntu-latest
    # github-list-pr-authors reads pull requests, which a private repo will not serve
    # to a token that was not granted it.
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    needs: [release,commit_parser]
    if: >
      (!contains(needs.commit_parser.outputs.title, '[no downstream]')
      && inputs.commitMessage != '[no downstream]')
      &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/'))
      &&
      github.event_name != 'pull_request'
      &&
      github.event.repository.fork == false
      &&
      !(failure() || cancelled())
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            acs-packaging
            alfresco-enterprise-repo
            alfresco-enterprise-share
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@16298278308f674c76542d61658da190e975e31c # v19.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Update downstream"
        id: update-downstream
        run: bash scripts/ci/update_downstream.sh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
      # Authors are everyone merged since the previous release, not just since the last
      # push, because the people behind a release run that failed would go unnamed.
      - name: "Find the previous release"
        id: baseline
        # Names are a nicety; losing them must not stop the release propagating.
        continue-on-error: true
        env:
          VERSION: ${{ steps.update-downstream.outputs.version }}
        run: |
          set -euo pipefail
          # The checkout is shallow, so reach back far enough to see the tag before this one.
          git fetch --deepen=200 --quiet origin
          echo "previous-release=$(git describe --abbrev=0 --tags "$VERSION^")" >> "$GITHUB_OUTPUT"
      # This release reaches acs-packaging as one bot commit, so the names travel with it.
      - name: "List who is in this release"
        id: authors
        if: steps.baseline.outputs.previous-release != ''
        continue-on-error: true
        uses: Alfresco/alfresco-build-tools/.github/actions/github-list-pr-authors@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          from-ref: ${{ steps.baseline.outputs.previous-release }}
          to-ref: ${{ github.sha }}
      # A bump arriving here carries its own authors, and attribution stops if they are dropped.
      - name: "Add the authors this release inherited"
        id: all-authors
        if: steps.baseline.outputs.previous-release != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FROM_REF: ${{ steps.baseline.outputs.previous-release }}
          TO_REF: ${{ github.sha }}
          OWN: ${{ steps.authors.outputs.cc }}
        run: |
          set -euo pipefail
          INHERITED=$(gh api "repos/$REPOSITORY/compare/$FROM_REF...$TO_REF" \
            --jq '.commits[].commit.message' \
            | sed -n 's/^Authors:[[:space:]]*//p') || INHERITED=""
          ALL=$(printf '%s\n%s\n' "$OWN" "$INHERITED" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' \
            | awk '!seen[$0]++' | paste -sd, -)
          echo "cc=$ALL" >> "$GITHUB_OUTPUT"
      - name: "Compute downstream commit message"
        id: commit-meta
        uses: Alfresco/alfresco-community-repo/.github/actions/get-downstream-commit-message@a78ccb823cee9d0d64f2d76d36fe86d97c9d1b04
        with:
          commit-title: ${{ needs.commit_parser.outputs.title }}
          version: ${{ steps.update-downstream.outputs.version }}
          # Handles only - this message lands in a repository with a different audience.
          authors: ${{ steps.all-authors.outputs.cc }}
          downstream-repo: "enterprise-share"
          trigger-release-on-force: "true"
      - name: "Commit downstream version update"
        uses: iarekylew00t/verified-bot-commit@3a1e72c2443cce5574f76a9b2bb36e355d667743 # v2.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Alfresco/acs-packaging
          ref: ${{ github.ref_name }}
          workspace: ${{ github.workspace }}/../acs-packaging
          files: |
            pom.xml
            .github/release-versions.yml
          message: ${{ steps.commit-meta.outputs.message }}
          allow-empty-commit: ${{ steps.commit-meta.outputs.allow-empty-commit }}
          if-no-commit: info
          update-local: false
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  mirroring:
    runs-on: ubuntu-latest
    needs: [update_downstream,commit_parser]
    if: >
      (!contains(needs.commit_parser.outputs.title, '[no mirror]')
      && inputs.commitMessage != '[no mirror]')
      &&
      github.ref_name == 'master'
      &&
      github.event_name != 'pull_request'
      &&
      github.event.repository.fork == false
      &&
      !(failure() || cancelled())
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            alfresco-enterprise-share
            alfresco-community-share
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api '/users/${{ steps.app-token.outputs.app-slug }}[bot]' --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Configure GitHub App bot user
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Mirror to community repository
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/ci/mirror-community-repo.sh "https://github.com/Alfresco/alfresco-community-share.git"
